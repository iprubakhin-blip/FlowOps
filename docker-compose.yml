services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flowops
      POSTGRES_PASSWORD: flowops_dev_password
      POSTGRES_DB: flowops
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - flowops_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowops -d flowops"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  flowops_pgdata:
