<div class="login-shell">
  <section class="login-card" aria-labelledby="login-title">
    <div class="logo"><span class="logo-icon">F</span><span>flowops<span class="logo-dot">.</span></span></div>
    <h1 id="login-title">Sign in<span class="h1-dot">.</span></h1>
    <p class="subtitle">Use your FlowOps account to open the operations dashboard.</p>

    @if (error()) {
      <div class="alert" role="alert">{{ error() }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label class="form-field" for="email">Email
        <input id="email" type="email" formControlName="email" autocomplete="username" maxlength="254" required />
      </label>
      <label class="form-field" for="password">Password
        <input id="password" type="password" formControlName="password" autocomplete="current-password" minlength="10" maxlength="128" required />
      </label>
      <button class="primary-button" type="submit" [disabled]="form.invalid || loading()">
        {{ loading() ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>
    <p class="back-link">The dashboard requires a signed-in session.</p>
  </section>
</div>
